/*
VOICE: salle d'enquête de nuit, concentrée, un peu brute
IDEA: les murs et plans d'un bureau d'enquêteurs de la DOA (insigne jaune et noir) (liège, photo aérienne, organigramme, relevé de tunnels)
PICTURE: le tableau lui-même, plein écran
COLOUR and TYPE: noir profond et jaune insigne DOA (#f7dc0a), bande hachurée jaune/noir, chaque type de tableau a son fond; Oswald + Barlow, polices d'écriture au choix
LAYOUT: barre d'outils fine en haut, tableau infini dessous, barre contextuelle au-dessus de l'élément choisi
*/
:root{color-scheme:dark;--wall:#0b0b09;--bar:#0a0a08;--ink:#f4f1e4;--mut:#a9a48f;--gold:#f7dc0a;--line:#34311f;--stripe:repeating-linear-gradient(-45deg,#f7dc0a 0 14px,#0a0a08 14px 28px)}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--wall);color:var(--ink);font:15px/1.4 Barlow,system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:8px 12px;background:var(--bar);border-bottom:1px solid #000;z-index:10;position:relative}

 for(const it of b.items){if(it.t==='path')it.pts.forEach(p=>add(p[0],p[1],p[0],p[1]));else add(it.x,it.y,it.x+it.w,it.y+hOf(it))}

 const z=Math.min(1.2,Math.max(.1,Math.min(r.width/bw,r.height/bh)));V={z,x:(r.width-bw*z)/2-bx*z,y:(r.height-bh*z)/2-by*z};applyV()}

function pin(it){const w=it.w,h=hOf(it),ly=it.t==='tag'?0:-h/2+13,a=(it.r||0)*Math.PI/180;return{x:it.x+w/2-ly*Math.sin(a),y:it.y+h/2+ly*Math.cos(a)}}
function center(it){if(it.t==='unit')return{x:it.x+it.w/2,y:it.y+30,r:34};if(it.t==='marker')return{x:it.x+it.w/2,y:it.y+24,r:28};const h=hOf(it);return{x:it.x+it.w/2,y:it.y+h/2,hw:it.w/2+4,hh:h/2+4}}
function edge(c,dx,dy){if(!dx&&!dy)return{x:c.x,y:c.y};if(c.r){const L=Math.hypot(dx,dy);return{x:c.x+dx/L*c.r,y:c.y+dy/L*c.r}}const t=Math.min(c.hw/Math.abs(dx||1e-9),c.hh/Math.abs(dy||1e-9));return{x:c.x+dx*t,y:c.y+dy*t}}

function curve(a,b){const d=Math.hypot(b.x-a.x,b.y-a.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2+Math.min(140,d*.12);return`M${f1(a.x)} ${f1(a.y)}Q${f1(mx)} ${f1(my)} ${f1(b.x)} ${f1(b.y)}`}
function linkD(k,A,Bi){
 if(k==='enquete')return curve(pin(A),pin(Bi));
 if(k==='organi'){const ax=A.x+A.w/2,ay=A.y+hOf(A),bx=Bi.x+Bi.w/2,by=Bi.y,my=f1((ay+by)/2);return`M${f1(ax)} ${f1(ay)}V${my}H${f1(bx)}V${f1(by)}`}
 const ca=center(A),cb=center(Bi),p=edge(ca,cb.x-ca.x,cb.y-ca.y),q=edge(cb,ca.x-cb.x,ca.y-cb.y);return`M${f1(p.x)} ${f1(p.y)}L${f1(q.x)} ${f1(q.y)}`}
const pd=pts=>pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join('');
function renderSvg(){
 const b=B(),k=b.kind,by=new Map(b.items.map(i=>[i.id,i]));

 const defs='<defs><radialGradient id="pg" cx=".35" cy=".35" r=".75"><stop offset="0" stop-color="#ff5a5a"/><stop offset=".6" stop-color="#c8102e"/><stop offset="1" stop-color="#6d0816"/></radialGradient>'+Object.entries(STR).map(([n,c])=>`<marker id="ah-${n}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`).join('')+'</defs>';
 for(const it of b.items){if(it.t!=='path'||!Array.isArray(it.pts)||it.pts.length<2)continue;
  const d=pd(it.pts),c=STR[it.color]||COL[it.color]||'#fff',sw=it.sw||40,on=sel===it.id,id=esc(it.id),ck=STR[it.color]?it.color:'blanc';
  if(it.st==='route')rt+=`<path class="rt" d="${d}" stroke="rgba(0,0,0,.45)" stroke-width="${sw+4}"/><path class="rt" d="${d}" stroke="${c}" stroke-width="${sw}" stroke-dasharray="${sw*2.4} ${sw*1.5}" marker-end="url(#ah-${ck})"/><path class="phit" data-p="${id}" d="${d}" style="stroke-width:${sw+18}px"/>`;
  else if(it.st==='tunnel'){tO+=`<path class="tn" d="${d}" stroke="${c}" stroke-width="${sw}"/>`;tI+=`<path class="tn" d="${d}" stroke="${k==='tunnel'?'#123e6d':'#1b2024'}" stroke-width="${Math.max(2,sw-8)}"/>`;tH+=`<path class="phit" data-p="${id}" d="${d}" style="stroke-width:${sw+14}px"/>`}

 if(mode){const pts=mode.pts.slice();if(last&&pts.length)pts.push([Math.round(last.x),Math.round(last.y)]);
  if(pts.length>1)vx+=`<path d="${pd(pts)}" fill="none" stroke="${mode.st==='route'?(STR[mode.color]||'#fff'):'#fff'}" stroke-width="${mode.st==='route'?6:Math.max(4,(mode.sw||40)/4)}" stroke-dasharray="12 8" stroke-linecap="round" pointer-events="none" opacity=".9"/>`;
  vx+=mode.pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="8" fill="#f5c518" stroke="#111" stroke-width="2" pointer-events="none"/>`).join('')}

 if(drag||editing||mode||uploading||document.activeElement===titleEl||docFocus()||!artDone){clearTimeout(tm);tm=setTimeout(save,1500);return}
 if(!art){dirty=false;status();return}
 if(ro)return;
 saving=true;status();S.saved=Date.now();
 nav(!$('#home').hidden);
 try{await art.publish(buildDoc());dirty=false}
 catch(err){const m=String(err&&(err.code||err.name||err.message)||err);if(/not_granted|not_writer/.test(m))ro=true;else if(!/conflict/.test(m)){clearTimeout(tm);tm=setTimeout(save,6000)}}
 saving=false;status()}
function flash(m){flashMsg=m;status();clearTimeout(flashT);flashT=setTimeout(()=>{flashMsg='';status()},1800)}
function status(){
 let t,c='';
 if(flashMsg)t=flashMsg;else if(uploading)t='Ajout de l\u2019image…';else if(ro){t='Lecture seule : modifs non gardées';c='ro'}
 else if(DB){if(dbErr==='revoked'){t='Accès retiré : recharge la page';c='ro'}else if(dbErr){t='Connexion perdue · reconnexion…';c='ro'}else if(!live)t='Connexion…';else if(dirty||flushing){t='Enregistrement…';c='dirty'}else t='En direct · à jour'}
 else if(!dbDone)t='Connexion…'
 else if(saving)t='Enregistrement…';else if(dirty){t='Modifié';c='dirty'}
 else if(artDone&&!art)t='Gardé sur cet appareil';else t='Enregistré';
 stEl.textContent=t;stEl.className=c;$('#hstatus').textContent=t}

/* ---------- temps réel : base partagée + présence ---------- */
function wanted(){const w=new Map();
 for(const b of S.boards){w.set('boards/'+b.id,boardDoc(b));
  for(const c of COLLS){const arr=b[c]||[];arr.forEach((x,i)=>{if(!x||!x.id)return;if(c==='blocks')x.o=i;w.set(`boards/${b.id}/${c}/${x.id}`,x)})}}
 return w}
/* fusion champ par champ : chaque personne n'envoie que ce qu'elle a changé */
const TAB='t'+Math.random().toString(36).slice(2,8);let wseq=0;
const srv=new Map(),inflight=new Map(),lastSent=new Map();
const isObj=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
function diff(lo,so){const patch={};for(const k of new Set([...Object.keys(lo||{}),...Object.keys(so||{})])){if(k[0]==='_')continue;const lv=lo?lo[k]:undefined,sv=so?so[k]:undefined;
  if(isObj(lv)&&isObj(sv)){const sub=diff(lv,sv);if(Object.keys(sub).length)patch[k]=sub}else if(stable(lv)!==stable(sv))patch[k]=(lv===undefined||lv===null)?null:lv}return patch}
function applyP(o,patch){const r=Object.assign({},o||{});for(const k in patch){const v=patch[k];if(v===null)delete r[k];else if(isObj(v)&&isObj(r[k]))r[k]=applyP(r[k],v);else r[k]=v}return r}
function mergeObj(lv,sv,rv,inf){const out={};for(const k of new Set([...Object.keys(lv||{}),...Object.keys(rv||{})])){const pend=(inf&&k in inf)||stable(lv&&lv[k])!==stable(sv&&sv[k]);const val=pend?(lv&&lv[k]):(rv&&rv[k]);if(val!==undefined&&val!==null)out[k]=val}return out}
function mergeIn(p,local,raw,lock){const v=plain(raw),old=srv.get(p)||{},inf=inflight.get(p)||{};srv.set(p,plain(raw));if(!local)return v;
 const out={};for(const k of new Set([...Object.keys(local),...Object.keys(v)])){if(k[0]==='_')continue;const lv=local[k],sv=old[k],rv=v[k];
  if(isObj(lv)&&isObj(rv)){out[k]=mergeObj(lv,isObj(sv)?sv:{},rv,isObj(inf[k])?inf[k]:(k in inf?lv:null));continue}
  const pend=(k in inf)||stable(lv)!==stable(sv)||(lock&&lock.includes(k));const val=pend?lv:rv;if(val!==undefined&&val!==null)out[k]=val}
 return plain(out)}
const staleEcho=(p,raw)=>{const w=raw&&raw._w;return typeof w==='string'&&w.startsWith(TAB+':')&&+w.slice(TAB.length+1)<(lastSent.get(p)||0)};
function scheduleFlush(){clearTimeout(flushT);flushT=setTimeout(flush,400)}
async function flush(){
 if(!live||ro)return;if(flushing){scheduleFlush();return}flushing=true;status();
 try{const w=wanted(),jobs=[];
  for(const [p,o] of w){const lo=plain(o);
   if(!srv.has(p)){if(inflight.has(p)&&stable(inflight.get(p))===stable(lo))continue;const n=++wseq;lastSent.set(p,n);inflight.set(p,lo);
    jobs.push(()=>DB.doc(p).set(Object.assign({},lo,{_w:TAB+':'+n})).then(()=>{if(!srv.has(p))srv.set(p,lo);if(lastSent.get(p)===n)inflight.delete(p)},e=>{if(lastSent.get(p)===n)inflight.delete(p);throw e}))}
   else{const patch=diff(lo,applyP(srv.get(p),inflight.get(p)||{}));if(!Object.keys(patch).length)continue;const n=++wseq;lastSent.set(p,n);inflight.set(p,applyP(inflight.get(p)||{},patch));
    jobs.push(()=>DB.doc(p).update(Object.assign({},patch,{_w:TAB+':'+n})).then(()=>{srv.set(p,applyP(srv.get(p)||{},patch));if(lastSent.get(p)===n)inflight.delete(p)},e=>{if(lastSent.get(p)===n)inflight.delete(p);const c=e&&e.code;if(c==='invalid_argument'||c==='not-found'){srv.delete(p);return}throw e}))}}
  for(const p of [...srv.keys()])if(!w.has(p)){const seg=p.split('/');srv.delete(p);inflight.delete(p);if(seg.length===2)jobs.push(()=>purgeBoard(seg[1]));jobs.push(()=>DB.doc(p).delete())}
  let i=0;const run=async()=>{while(i<jobs.length){const j=jobs[i++];await j()}};await Promise.all([run(),run(),run(),run()]);
  dirty=false}
 catch(e){const c=e&&e.code;if(c==='invalid_argument'||c==='permission-denied'){ro=true;flash('Tu peux consulter, mais pas modifier ce tableau')}else if(c==='quota_exceeded')flash('Espace plein : supprime des éléments ou des images');else if(c==='revoked'){connLost(e)}else setTimeout(scheduleFlush,1500+Math.random()*1500)}
 flushing=false;status();if(dirty&&!ro)scheduleFlush()}
async function purgeBoard(bid){for(const c of COLLS){try{const q=await DB.collection(`boards/${bid}/${c}`).get();for(const d of q.docs){const pp=`boards/${bid}/${c}/${d.id}`;srv.delete(pp);await DB.doc(pp).delete()}}catch(e){}}}
function applyPending(){const b=B();if(b&&b.kind==='rapport'&&$('#home').hidden&&!docFocus())renderDoc()}
let editStart=null;
function afterRemote(cur){
 if(!$('#home').hidden){showHome();return}
 const b=B();if(!b)return;if(b.blocks)b.blocks.sort((a,c)=>(a.o??0)-(c.o??0)||String(a.id).localeCompare(String(c.id)));
 if(cur){renderAll();if(b.kind!=='rapport')tools()}}
function onBoards(snap){
 const first=!onBoards.done;onBoards.done=true;
 if(first){
  const ids=new Set(snap.docs.map(d=>d.id));
  return DB.doc('app/meta').get().then(async m=>{
   if(!m.exists){const mine=S.boards.filter(b=>!ids.has(b.id));live=true;if(mine.length)markDirty();try{await DB.doc('app/meta').set({migrated:1,at:Date.now()})}catch(e){}}
   else{S.boards=S.boards.filter(b=>ids.has(b.id)||!srv.has('boards/'+b.id)&&b._local)}
   for(const d of snap.docs)mergeBoard(d.id,d.data());
   live=true;status();
   if(CUR&&!S.boards.some(b=>b.id===CUR))CUR=null;
   if(!$('#home').hidden||!CUR)showHome();else{subBoard=null;switchTo(CUR)}
   if(dirty)scheduleFlush();
  }).catch(()=>{live=true;for(const d of snap.docs)mergeBoard(d.id,d.data());status()})}
 let curGone=false,curChanged=false;
 for(const ch of snap.docChanges()){const id=ch.doc.id,p='boards/'+id;
  if(ch.type==='removed'){srv.delete(p);inflight.delete(p);if(!S.boards.some(b=>b.id===id))continue;S.boards=S.boards.filter(b=>b.id!==id);if(id===CUR)curGone=true}
  else{const ch2=mergeBoard(id,ch.doc.data());if(id===CUR&&ch2)curChanged=true}}
 if(curGone&&$('#home').hidden){showHome();flash('Ce tableau a été supprimé par un collègue')}
 else if(!$('#home').hidden&&snap.docChanges().length)showHome();
 else if(curChanged){const b=B();if(b){if(document.activeElement!==titleEl)titleEl.value=b.title||'';renderAll();if(b.kind!=='rapport')tools()}}}
function mergeBoard(id,raw){const p='boards/'+id;if(staleEcho(p,raw))return false;let b=S.boards.find(x=>x.id===id);
 const local=b?plain(boardDoc(b)):null,lock=(b&&id===CUR&&document.activeElement===titleEl)?['title']:null;
 const m=mergeIn(p,local,raw,lock);if(b&&stable(boardDoc(b))===stable(m))return false;
 if(!b){b={id,items:[],links:[],blocks:[]};S.boards.push(b)}
 for(const k of Object.keys(b))if(!COLLS.includes(k)&&k!=='id'&&k[0]!=='_')delete b[k];
 Object.assign(b,m);for(const c of COLLS)if(!Array.isArray(b[c]))b[c]=[];return true}
function subscribeBoard(bid){
 if(subBoard===bid)return;subs.splice(0).forEach(u=>{try{u()}catch(e){}});subBoard=bid;
 for(const c of COLLS){let first=true;
  subs.push(DB.collection(`boards/${bid}/${c}`).onSnapshot(snap=>{
   const b=S.boards.find(x=>x.id===bid);if(!b)return;const arr=b[c]=b[c]||[];let touched=false;
   if(first){first=false;const ids=new Set(snap.docs.map(d=>d.id));
    for(let i=arr.length-1;i>=0;i--){const x=arr[i],p=`boards/${bid}/${c}/${x.id}`;if(!ids.has(x.id)&&srv.has(p)){arr.splice(i,1);srv.delete(p);touched=true}}
    for(const d of snap.docs)touched=applyDoc(b,c,d.id,d.data())||touched}
   else for(const ch of snap.docChanges())touched=applyDoc(b,c,ch.doc.id,ch.type==='removed'?null:ch.doc.data())||touched;
   if(dbErr&&dbErr!=='revoked'){dbErr=false;reconnDelay=2000;status()}
   if(touched&&bid===CUR)afterRemote(true)},e=>connLost(e)))}}
/* reconnexion automatique */
let boardsGen=0,reconnT=null,reconnDelay=2000,hiddenAt=0;
function startBoards(){const gen=++boardsGen;let first=true;try{unsubBoards&&unsubBoards()}catch(e){}
 unsubBoards=DB.collection('boards').onSnapshot(s=>{if(gen!==boardsGen)return;if(dbErr&&dbErr!=='revoked'){dbErr=false;reconnDelay=2000;status()}
  if(first){first=false;if(onBoards.done){reconcileBoards(s);return}}onBoards(s)},e=>{if(gen===boardsGen)connLost(e)})}
function connLost(e){if(e&&e.code==='revoked'){dbErr='revoked';status();return}if(e&&e.code==='invalid_argument'){console.warn(e);}dbErr=true;status();if(reconnT)return;reconnT=setTimeout(()=>{reconnT=null;reconnect()},reconnDelay);reconnDelay=Math.min(30000,reconnDelay*2)}
function reconnect(){clearTimeout(reconnT);reconnT=null;if(!DB||dbErr==='revoked')return;startBoards();if(CUR&&$('#home').hidden){subBoard=null;subscribeBoard(CUR)}if(dirty)scheduleFlush()}
function reconcileBoards(s){const ids=new Set(s.docs.map(d=>d.id));let gone=false;
 for(const b of [...S.boards]){const p='boards/'+b.id;if(!ids.has(b.id)&&srv.has(p)){S.boards=S.boards.filter(x=>x!==b);srv.delete(p);if(b.id===CUR)gone=true}}
 for(const d of s.docs)mergeBoard(d.id,d.data());
 if(gone&&$('#home').hidden){showHome();flash('Ce tableau a été supprimé par un collègue')}else if(!$('#home').hidden)showHome();else if(B()){renderAll();if(B().kind!=='rapport')tools()}}
addEventListener('online',()=>{if(DB){reconnDelay=2000;reconnect()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now();return}if(DB&&(dbErr||Date.now()-hiddenAt>20000))reconnect()});
[stEl,$('#hstatus')].forEach(el=>el.addEventListener('click',()=>{if(DB&&dbErr&&dbErr!=='revoked'){reconnDelay=2000;reconnect()}}));
function applyDoc(b,c,id,raw){const p=`boards/${b.id}/${c}/${id}`,arr=b[c],i=arr.findIndex(x=>x.id===id);
 if(raw===null){srv.delete(p);inflight.delete(p);if(i<0)return false;if(editing===id||(drag&&drag.it&&drag.it.id===id))return false;arr.splice(i,1);if(sel===id)sel=null;return true}
 if(staleEcho(p,raw))return false;
 const local=i>=0?arr[i]:null,m=mergeIn(p,local?plain(local):null,raw,editing===id?['text','rt']:null);m.id=id;
 if(local&&stable(local)===stable(m))return false;
 if(local){for(const k of Object.keys(local))if(!(k in m))delete local[k];Object.assign(local,m)}else arr.push(m);
 return true}
/* présence */
function myPresence(patch){if(!ROOM)return;Object.assign(presQ,patch);if(presT)return;presT=setTimeout(()=>{presT=null;const q=presQ;presQ={};ROOM.presence(q).catch(()=>{})},40)}
async function paintPeers(){
 if(!ROOM){return}const peers=ROOM.peers().filter(p=>p.kind==='viewer'&&!(p.isMe&&p.sameTab));
 const ids=[...new Set(peers.map(p=>p.by).filter(Boolean))];if(USR&&ids.length){try{profCache=Object.assign(profCache,await USR.profiles(ids))}catch(e){}}
 const nameOf=p=>(p.by&&profCache[p.by]&&profCache[p.by].name)||(p.isMe?'Toi (autre onglet)':'Collègue');
 const colOf2=p=>(p.presence&&typeof p.presence.c==='string'&&/^#[0-9a-f]{3,8}$/i.test(p.presence.c)?p.presence.c:(p.by&&profCache[p.by]&&profCache[p.by].color)||'#f7dc0a');
 const uniq=[];const seen=new Set();for(const p of peers){const k=p.by||p.peer;if(seen.has(k))continue;seen.add(k);uniq.push(p)}
 for(const el of [$('#peers'),$('#hpeers')]){el.innerHTML='';uniq.slice(0,5).forEach(p=>{const d=document.createElement('span');d.className='av2';d.style.setProperty('--pc',colOf2(p));d.title=nameOf(p)+(p.presence&&p.presence.b?' · '+((S.boards.find(b=>b.id===p.presence.b)||{}).title||''):'');const pr=p.by&&profCache[p.by];if(pr&&pr.avatarUrl){const im=document.createElement('img');im.alt='';im.src=pr.avatarUrl;d.appendChild(im)}else d.textContent=(nameOf(p)[0]||'?').toUpperCase();el.appendChild(d)});
  if(uniq.length>5){const m=document.createElement('span');m.className='more';m.textContent='+'+(uniq.length-5);el.appendChild(m)}}
 const here=peers.filter(p=>p.presence&&p.presence.b===CUR&&$('#home').hidden);
 const cs=$('#cursors');cs.innerHTML='';
 for(const el of elMap.values())el.classList.remove('peersel');
 paper.querySelectorAll('.blk[data-who]').forEach(n=>{n.removeAttribute('data-who')});
 for(const p of here){const pr=p.presence,c=colOf2(p);
  if(typeof pr.x==='number'&&typeof pr.y==='number'&&B()&&B().kind!=='rapport'){const d=document.createElement('div');d.className='cur';d.style.setProperty('--pc',c);d.style.transform=`translate(${pr.x}px,${pr.y}px) scale(var(--iz,1))`;d.innerHTML=`<svg viewBox="0 0 24 24"><path d="M3 2l17 9-7 2-3 7z" fill="${c}" stroke="#0a0a08" stroke-width="1.6" stroke-linejoin="round"/></svg>`;const s=document.createElement('span');s.textContent=nameOf(p);d.appendChild(s);cs.appendChild(d)}
  if(typeof pr.s==='string'){const el=elMap.get(pr.s);if(el){el.classList.add('peersel');el.style.setProperty('--pc',c)}}
  if(typeof pr.k==='string'){const n=paper.querySelector(`[data-k="${CSS.escape(pr.k)}"]`);if(n){n.dataset.who=nameOf(p);n.style.setProperty('--pc',c)}}}}
if(cl){
 Promise.resolve(cl.use('db')).catch(()=>null).then(async d=>{dbDone=true;
  if(!d){status();if(dirty)markDirty();return}
  DB=d;status();
  try{USR=await cl.use('user');if(USR){myId=await USR.id();const me=await USR.me();if(me&&me.color)myColor=me.color}}catch(e){}
  try{if(USR){const w=await USR.can('data.write');if(w===false){ro=true;status()}}}catch(e){}
  startBoards();
  setTimeout(()=>{if(!live){status()}},10000)});
 Promise.resolve(cl.use('room')).catch(()=>null).then(r=>{if(!r)return;ROOM=r;myPresence({c:myColor,b:$('#home').hidden?CUR:null});r.onPeers(()=>paintPeers(),()=>{})});
}

/* ---------- démarrage ---------- */
let ss=null;try{ss=JSON.parse(sessionStorage.getItem(VK)||'null')}catch(e){}
if(!ss)try{const l=JSON.parse(localStorage.getItem(VK)||'null');if(l&&Date.now()-(l.t||0)<10*60e3)ss=l}catch(e){}
const hb=location.hash.slice(1);if(hb&&S.boards.some(b=>b.id===hb))ss=Object.assign({views:{}},ss||{},{cur:hb,home:false});
let pend=null;try{pend=JSON.parse(localStorage.getItem(PK)||'null')}catch(e){}
if(pend&&pend.s&&pend.base===BASE&&Date.now()-pend.at<30*60e3&&JSON.stringify(pend.s.boards)!==JSON.stringify(S.boards)){S=migrate(pend.s);setTimeout(()=>{markDirty()},0)}else try{localStorage.removeItem(PK)}catch(e){}
if(ss&&ss.views)views=ss.views;
let want=ss&&ss.cur;try{want=want||localStorage.getItem(CK)}catch(e){}
if(!S.boards.length)showHome();else{switchTo(S.boards.some(b=>b.id===want)?want:S.boards[0].id);
if(ss&&!ss.home){if(ss.sel&&get(ss.sel)){sel=ss.sel;renderAll()}}else showHome()}
if(document.fonts)document.fonts.ready.then(()=>{for(const [id,el] of elMap)hc[id]=el.offsetHeight;if(B()){renderSvg();placeMini()}});
addEventListener('resize',placeMini);
addEventListener('beforeunload',e=>{if(dirty&&(art||DB)&&!ro){e.preventDefault();e.returnValue=''}});
status();
}
